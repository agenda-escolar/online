<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Escolar</title>
  <meta name="theme-color" content="#7effd4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="img/icon-192.png" />
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="manifest" href="./manifest.json">

<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    #container-avisos-geral {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 20px;
      display: none;
      flex-direction: column;
      gap: 18px;
    }
.aviso-geral-card {
      background: linear-gradient(135deg, #ffffff 0%, #f0fff4 100%);
      border-left: 6px solid #63e89f;
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.35), 0 0 0 1px rgba(99,232,159,0.15);
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: slideDown 0.6s ease;
      position: relative;
      overflow: hidden;
    }
    @keyframes slideDown { from{opacity:0; transform:translateY(-15px)} to{opacity:1; transform:translateY(0)} }
.aviso-geral-badge { background:#63e89f; color:#033618; font-size:10px; font-weight:900; padding:5px 12px; border-radius:20px; text-transform:uppercase; display:inline-block; margin-bottom:6px; }
.aviso-geral-texto {
      color:#1b3a2a;
      font-size:16px;
      font-weight:600;
      white-space:pre-wrap;
      line-height:1.5;
      text-align: justify;
      background: #dff8e7;
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 8px;
      word-break: break-word;
      overflow-wrap: anywhere;
      
}
.aviso-geral-datas { margin-top:10px; font-size:12px; background:#dff8e7; padding:5px 10px; border-radius:8px; display:inline-block; font-weight:700; color:#2d5a3d; }
    div.swal2-container{ z-index:99999!important; }
.forgot-password { text-align: center; margin-top: 12px; }
.forgot-password a { color: #4CAF50; text-decoration: none; font-size: 13px; font-weight: bold; }
.forgot-password a:hover { text-decoration: underline; }

    /* SÓ NO CELULAR - CENTRALIZA TUDO, MAS TEXTO JUSTIFICADO */
    @media (max-width: 768px) {
    .aviso-geral-card {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
    .aviso-geral-card > div:last-child {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
    .aviso-geral-texto {
        text-align: justify;
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
</head>
<body>
  <div class="geral">
    <div class="logo"><img src="./img/logo.png" alt="Logo" class="logo-img"></div>
    <div class="titulo"><h1>Instituto Educacional Marito Dutra</h1><p><b>AGENDA ESCOLAR 2026</b></p></div>
    <div class="botoes">
      <div class="area-aluno" onclick="abrirModal('aluno')"><img src="./img/aluna.png" class="logo-aluno-professor" alt="Aluno"></div>
      <div class="area-professor" onclick="abrirModal('professor')"><img src="./img/professor.png" class="logo-aluno-professor" alt="Professor"></div>
    </div>
  </div>

  <div id="container-avisos-geral"></div>

  <div id="modal-aluno" class="modal">
    <form id="aluno-login-form">
      <h2>Login Aluno</h2>
      <input type="text" id="aluno-matricula" placeholder="Email" required>
      <div class="password-wrapper"><input type="password" id="aluno-senha" placeholder="Senha" required><span class="toggle-password" data-target="aluno-senha">👁️</span></div>
      <button type="submit" id="btn-aluno">Entrar</button><button type="button" onclick="fecharModal('aluno')">Fechar</button>
      <p class="forgot-password"><a href="#" class="esqueci-senha">Esqueceu a senha?</a></p>
    </form>
  </div>
  <div id="modal-professor" class="modal">
    <form id="professor-login-form">
      <h2>Login Professor</h2>
      <input type="email" id="professor-email" placeholder="Email" required>
      <div class="password-wrapper"><input type="password" id="professor-senha" placeholder="Senha" required><span class="toggle-password" data-target="professor-senha">👁️</span></div>
      <button type="submit" id="btn-prof">Entrar</button><button type="button" onclick="fecharModal('professor')">Fechar</button>
      <p class="forgot-password"><a href="#" class="esqueci-senha">Esqueceu a senha?</a></p>
    </form>
  </div>

  <script src="js/script.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDJnKktnaupmHUwL-jZHIeionowOb6Egrg", authDomain: "agenda-escolar-19fda.firebaseapp.com", projectId: "agenda-escolar-19fda", storageBucket: "agenda-escolar-19fda.firebasestorage.app", messagingSenderId: "460998217684", appId: "1:460998217684:web:98e4a2cc23b467124bd041" };
    const appInst = initializeApp(firebaseConfig);
    const auth = getAuth(appInst);
    const db = getFirestore(appInst);

    async function mostrarAvisosGerais(){
      const snap = await getDocs(collection(db, "avisos_geral"));
      const container = document.getElementById('container-avisos-geral');
      const hoje = new Date().toISOString().split('T')[0];
      let html = '';
      snap.forEach(d=>{
        const av=d.data();
        if(hoje <= av.fim){
          const iBR=av.inicio.split('-').reverse().join('/'); const fBR=av.fim.split('-').reverse().join('/');
          const periodo=iBR===fBR?`Dia ${iBR}`:`De ${iBR} até ${fBR}`;
          html+=`<div class="aviso-geral-card"><div style="font-size:28px">📢</div><div><span class="aviso-geral-badge">Aviso da Direção</span><br /><div class="aviso-geral-datas"> ${periodo}</div><div class="aviso-geral-texto">${av.mensagem}</div></div></div>`;
        }
      });
      if(html){ container.innerHTML=html; container.style.display='flex'; }
    }
    mostrarAvisosGerais();

    document.querySelectorAll('.toggle-password').forEach(el=>{ el.onclick=()=>{ const i=document.getElementById(el.dataset.target); i.type=i.type==='password'?'text':'password'; }});

    document.getElementById('aluno-login-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const btn = document.getElementById('btn-aluno'); btn.disabled = true; btn.textContent = 'Verificando...';
      try{
        const cred = await signInWithEmailAndPassword(auth, document.getElementById('aluno-matricula').value.trim(), document.getElementById('aluno-senha').value);
        const docSnap = await getDoc(doc(db,'alunos',cred.user.uid));
        if(!docSnap.exists()){
          await signOut(auth);
          Swal.fire('Erro','Aluno não encontrado no sistema','error');
          return;
        }
        const dados = docSnap.data();
        if(dados.status === 'inativo' || dados.status === 'arquivado'){
          await signOut(auth);
          Swal.fire('Acesso Bloqueado','Este aluno não pode mais acessar a agenda. Fale com a secretaria.','error');
          return;
        }
        localStorage.setItem('uid',cred.user.uid);
        localStorage.setItem('nomeAluno',dados.nome);
        location.href='aluno.html';
      }catch(err){
        Swal.fire('Erro','Email ou senha inválidos','error');
      }finally{ btn.disabled=false; btn.textContent='Entrar'; }
    });

    document.getElementById('professor-login-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const btn = document.getElementById('btn-prof'); btn.disabled = true; btn.textContent = 'Verificando...';
      try{
        const cred = await signInWithEmailAndPassword(auth, document.getElementById('professor-email').value.trim(), document.getElementById('professor-senha').value);
        const docSnap = await getDoc(doc(db,'professores',cred.user.uid));
        if(!docSnap.exists()){
          await signOut(auth);
          Swal.fire('Erro','Professor não encontrado','error');
          return;
        }
        const dados = docSnap.data();
        if(dados.status === 'inativo' || dados.status === 'arquivado'){
          await signOut(auth);
          Swal.fire('Acesso Bloqueado','Este professor foi arquivado. Fale com a direção.','error');
          return;
        }
        localStorage.setItem('uid',cred.user.uid);
        localStorage.setItem('nomeProfessor',dados.nome);
        location.href='agendamento.html';
      }catch(err){
        console.error(err);
        Swal.fire('Erro','Email ou senha inválidos','error');
      }finally{ btn.disabled=false; btn.textContent='Entrar'; }
    });

    document.querySelectorAll('.esqueci-senha').forEach(link => {
      link.addEventListener('click', async (e) => {
        e.preventDefault();
        const { value: email } = await Swal.fire({
          title: 'Recuperar senha',
          input: 'email',
          inputLabel: 'Digite seu email',
          inputPlaceholder: 'seu@email.com',
          confirmButtonText: 'Enviar link',
          confirmButtonColor: '#4CAF50',
          cancelButtonText: 'Cancelar',
          showCancelButton: true,
          inputValidator: (value) => { if (!value) return 'digite um email valido!'; }
        });
        if (!email) return;
        Swal.fire({title: 'Verificando...', didOpen: () => Swal.showLoading(), allowOutsideClick: false, showConfirmButton: false});
        try {
          await sendPasswordResetEmail(auth, email.trim());
          Swal.fire({ icon: 'success', title: 'Enviado!', text: 'Link de recuperação enviado. Checa teu email e o spam', confirmButtonColor: '#4CAF50' });
        } catch (error) {
          let msgErro = 'Erro ao enviar email. Tenta de novo';
          if (error.code === 'auth/user-not-found') msgErro = 'Email não existe';
          else if (error.code === 'auth/invalid-email') msgErro = 'Email inválido';
          Swal.fire({ icon: 'error', title: 'Deu ruim', text: msgErro, confirmButtonColor: '#4CAF50' });
        }
      });
    });
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
